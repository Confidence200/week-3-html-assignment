<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pricing Table</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <header>
      <h1>SUBSCRIPTION PRICING LIST</h1>
      <p>List of prices</p>
    </header>

    <main>
      <section class="pricing">
        <div class="cards">
          <label class="card">
            <input type="radio" name="plan" value="basic" />

            <div class="card-header">
              <h2>BASIC</h2>
              <p>Perfect for getting started</p>
            </div>

            <div class="card-price">
              <span class="amount">$9</span>
              <span class="period">/Month</span>
            </div>

            <ul class="features">
              <li>Free data</li>
              <li>Free Channels</li>
              <li>Extra bonus</li>
            </ul>

            <span class="button">Choose Plan</span>
          </label>

          <label class="card popular">
            <input type="radio" name="plan" value="pro" />
            <span class="badge">Most Popular</span>

            <div class="card-header">
              <h2>PRO</h2>
              <p>Best for growing teams</p>
            </div>

            <div class="card-price">
              <span class="amount">$29</span>
              <span class="period">/Month</span>
            </div>

            <ul class="features">
              <li>Free data</li>
              <li>Free channels</li>
              <li>Extra bonus</li>
              <li>Extra slots</li>
              <li>Custom domain</li>
            </ul>

            <span class="button">Choose Plan</span>
          </label>

          <label class="card">
            <input type="radio" name="plan" value="premium" />

            <div class="card-header">
              <h2>PREMIUM</h2>
              <p>
                Everything a large company needs, including dedicated support,
                custom setup, advanced security, priority updates and a personal
                account manager who is available whenever your team needs help.
              </p>
            </div>

            <div class="card-price">
              <span class="amount">$99</span>
              <span class="period">/Month</span>
            </div>

            <ul class="features">
              <li>Free data</li>
              <li>Free channels</li>
              <li>Unlimited slots</li>
              <li>Unlimited Storage</li>
            </ul>

            <span class="button">Choose Plan</span>
          </label>
        </div>
      </section>
    </main>
  </body>
</html>
